<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<meta name="referrer" content="no-referrer"/>
<title>Super X</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>/* ============================================================
   WASL v2 — Design System
   ============================================================ */
:root{
  --ink:#0a0f1e; --ink2:#1b2440; --mut:#5b6780; --mut2:#9aa5bd;
  --bg:#f5f7fc; --card:#fff; --line:#e7ebf3; --line2:#eef1f8;
  --brand:#0d9488; --brand2:#2dd4bf; --brandDeep:#0f766e; --brandSoft:#e4f7f4; --brandInk:#0a5c54;
  --navy:#0a1024; --navy2:#101832;
  --amber:#d97706; --amberSoft:#fdf2e3;
  --red:#e11d48; --redSoft:#fdeef2;
  --green:#059669; --greenSoft:#e5f6ef;
  --blue:#2f6bff; --blueSoft:#e9efff;
  --violet:#7c3aed; --violetSoft:#f2ecfe;
  --grad-brand:linear-gradient(135deg,#0d9488,#0f766e);
  --grad-navy:linear-gradient(160deg,#0c1330 0%,#101b3f 55%,#0d1530 100%);
  --sh-xs:0 1px 2px rgba(10,15,30,.05);
  --sh:0 1px 2px rgba(10,15,30,.04),0 10px 30px -14px rgba(10,15,30,.14);
  --sh-lg:0 24px 60px -20px rgba(10,15,30,.28);
  --r:18px; --r2:13px;
  --ease:cubic-bezier(.22,.9,.32,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{direction:rtl}
html,body{overflow-x:hidden}
body{font-family:'Cairo','Noto Sans Arabic','IBM Plex Sans Arabic','Segoe UI',system-ui,sans-serif;background:
  radial-gradient(1200px 500px at 85% -10%,rgba(13,148,136,.07),transparent),
  radial-gradient(900px 420px at -5% 105%,rgba(47,107,255,.05),transparent),
  var(--bg);
  color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;letter-spacing:.1px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:rgba(13,148,136,.18)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#cdd5e4;border-radius:10px;border:2.5px solid var(--bg)}::-webkit-scrollbar-track{background:transparent}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(225,29,72,.35)}70%{box-shadow:0 0 0 14px rgba(225,29,72,0)}100%{box-shadow:0 0 0 0 rgba(225,29,72,0)}}
@keyframes pulseSoft{0%{box-shadow:0 0 0 0 rgba(13,148,136,.3)}70%{box-shadow:0 0 0 12px rgba(13,148,136,0)}100%{box-shadow:0 0 0 0 rgba(13,148,136,0)}}
@keyframes dash{to{stroke-dashoffset:-14}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

/* ---------------- Shell ---------------- */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.side{background:var(--grad-navy);color:#aab4d4;padding:20px 16px;display:flex;flex-direction:column;gap:5px;position:sticky;top:0;height:100vh;overflow-y:auto}
.side:before{content:'';position:absolute;top:-80px;right:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.14),transparent 70%);pointer-events:none}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px 20px;position:relative}
.brand .logo{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,#2dd4bf,#0d9488 60%,#0b5c54);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;box-shadow:0 10px 24px -6px rgba(13,148,136,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.brand b{color:#fff;font-size:18px;font-weight:800;letter-spacing:.2px}
.brand small{display:block;color:#6d7ba3;font-size:10.5px;font-weight:600;margin-top:-3px}
.navlab{font-size:10px;font-weight:700;color:#57648c;letter-spacing:1.2px;padding:16px 12px 5px;text-transform:uppercase}
.nav{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:12px;color:#98a5c9;font-weight:600;font-size:13.5px;width:100%;text-align:right;transition:all .18s var(--ease);position:relative}
.nav svg{width:18px;height:18px;flex:none;opacity:.85}
.nav:hover{background:rgba(255,255,255,.055);color:#e6ebf7;transform:translateX(-2px)}
.nav.on{background:linear-gradient(90deg,rgba(45,212,191,.16),rgba(45,212,191,.03));color:#7ff0e1;font-weight:700}
.nav.on:before{content:'';position:absolute;right:-16px;top:8px;bottom:8px;width:4px;border-radius:4px;background:linear-gradient(180deg,#2dd4bf,#0d9488);box-shadow:0 0 12px rgba(45,212,191,.6)}
.nav .pip{margin-inline-start:auto;background:linear-gradient(135deg,#fb7185,#e11d48);color:#fff;font-size:10px;font-weight:800;border-radius:99px;padding:1.5px 8px;box-shadow:0 4px 10px -3px rgba(225,29,72,.5)}
.side .foot{margin-top:auto;padding:14px;border-radius:16px;background:linear-gradient(160deg,rgba(45,212,191,.1),rgba(255,255,255,.03));border:1px solid rgba(255,255,255,.09)}
.side .foot b{color:#d9e1f5;font-size:12.5px}
.side .foot p{font-size:11px;color:#6d7ba3;line-height:1.7}

.main{padding:24px 30px 48px;min-width:0;animation:fadeUp .35s var(--ease)}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.topbar h1{font-size:22px;font-weight:800;letter-spacing:-.3px}
.topbar .sub{color:var(--mut);font-size:12.5px;margin-top:-3px;font-weight:500}
.topbar .sp{flex:1}
.portalSwitch{display:flex;background:#fff;border:1px solid var(--line);border-radius:14px;padding:4px;gap:3px;box-shadow:var(--sh)}
.portalSwitch button{display:flex;align-items:center;gap:7px;padding:8.5px 15px;border-radius:10px;font-weight:700;font-size:12.5px;color:var(--mut);transition:all .18s var(--ease)}
.portalSwitch button svg{width:15px;height:15px}
.portalSwitch button:hover{color:var(--ink)}
.portalSwitch button.on{background:var(--grad-navy);color:#fff;box-shadow:0 6px 16px -6px rgba(10,15,30,.55)}
.iconbtn{width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink2);position:relative;box-shadow:var(--sh-xs);transition:.18s}
.iconbtn:hover{border-color:#c9d2e4;transform:translateY(-1px);box-shadow:var(--sh)}
.iconbtn .dot{position:absolute;top:10px;left:10px;width:7px;height:7px;border-radius:99px;background:var(--red);border:2px solid #fff}
.iconbtn,.avatar,.topbar .btn{flex:none}
.avatar{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#fbbf24,#d97706);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13.5px;box-shadow:0 6px 14px -6px rgba(217,119,6,.5)}

/* ---------------- Cards ---------------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);transition:box-shadow .2s}
.card:hover{box-shadow:var(--sh),0 14px 34px -18px rgba(10,15,30,.18)}
.card .hd{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line2)}
.card .hd h3{font-size:14.5px;font-weight:800}
.card .hd .sp{flex:1}
.card .bd{padding:20px}
.grid{display:grid;gap:18px}
.grid>*{min-width:0}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.9fr) minmax(0,1fr)}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.9fr)}
@media(max-width:1150px){.g4{grid-template-columns:repeat(2,1fr)}.g3,.g21,.g12{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wrap{flex-wrap:wrap}

/* ---------------- Stats ---------------- */
.stat{padding:18px 20px 46px;position:relative;overflow:hidden}
.stat:before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.7),transparent 40%);pointer-events:none}
.stat .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 8px 18px -8px rgba(10,15,30,.25),inset 0 1px 0 rgba(255,255,255,.4)}
.stat .ic svg{width:20px;height:20px}
.stat .v{font-size:25px;font-weight:800;letter-spacing:-.6px;margin-top:10px;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--mut);font-weight:600}
.stat .trend{position:absolute;top:18px;left:18px;font-size:11px;font-weight:800;padding:4px 10px;border-radius:99px;display:flex;align-items:center;gap:4px;box-shadow:var(--sh-xs)}
.stat .spark{position:absolute;bottom:-4px;left:0;right:0;height:36px;opacity:.38;pointer-events:none}
.up{color:var(--green);background:var(--greenSoft)}
.down{color:var(--red);background:var(--redSoft)}

/* ---------------- Badges ---------------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;padding:4px 11px;border-radius:99px;border:1px solid transparent}
.badge svg{width:12px;height:12px}
.b-green{background:var(--greenSoft);color:#047857;border-color:rgba(5,150,105,.18)}
.b-amber{background:var(--amberSoft);color:#b45309;border-color:rgba(217,119,6,.2)}
.b-red{background:var(--redSoft);color:#be123c;border-color:rgba(225,29,72,.18)}
.b-blue{background:var(--blueSoft);color:#1d4ed8;border-color:rgba(47,107,255,.18)}
.b-violet{background:var(--violetSoft);color:#6d28d9;border-color:rgba(124,58,237,.18)}
.b-gray{background:#f0f2f8;color:var(--mut);border-color:var(--line)}
.b-teal{background:var(--brandSoft);color:var(--brandInk);border-color:rgba(13,148,136,.2)}
.dot8{width:8px;height:8px;border-radius:99px;display:inline-block;flex:none}
.blink{animation:pulseSoft 2s infinite}

/* ---------------- Buttons ---------------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:12px;font-weight:700;font-size:13px;transition:all .18s var(--ease);border:1px solid transparent;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--grad-brand);color:#fff;box-shadow:0 8px 20px -8px rgba(13,148,136,.6),inset 0 1px 0 rgba(255,255,255,.2)}
.btn-p:hover{box-shadow:0 12px 26px -8px rgba(13,148,136,.7);transform:translateY(-1px)}
.btn-d{background:var(--grad-navy);color:#fff;box-shadow:0 8px 20px -8px rgba(10,15,30,.55)}
.btn-d:hover{transform:translateY(-1px)}
.btn-o{background:#fff;border-color:var(--line);color:var(--ink2);box-shadow:var(--sh-xs)}
.btn-o:hover{border-color:#c4cde0;background:#fafbff;transform:translateY(-1px)}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:10px}
.btn-lg{padding:15px 22px;font-size:14.5px;border-radius:14px;width:100%}
.btn-red{background:var(--redSoft);color:var(--red)}
.btn-red:hover{background:#fbdce4}
.btn-green{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 8px 20px -8px rgba(5,150,105,.6)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none!important}

/* ---------------- Tables ---------------- */
.tbl{width:100%;border-collapse:separate;border-spacing:0}
.tbl th{font-size:10.5px;font-weight:700;color:var(--mut2);text-align:right;padding:11px 16px;background:#fafbfe;border-bottom:1px solid var(--line2);white-space:nowrap;letter-spacing:.4px}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line2);font-size:13px;vertical-align:middle;white-space:nowrap}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .12s}
.tbl tbody tr:hover td{background:#f7fafd}
.tbl .main-cell{font-weight:700}
.tbl .sub{font-size:11px;color:var(--mut);font-weight:500}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------------- Forms ---------------- */
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12px;font-weight:700;color:var(--ink2)}
.field .inp{border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;background:#fff;font-size:13.5px;outline:none;transition:all .15s;width:100%}
.field .inp:hover{border-color:#cbd5e6}
.field .inp:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(13,148,136,.12)}
.field .hint{font-size:11px;color:var(--mut);line-height:1.7}
.select{position:relative}
.select select{appearance:none;-webkit-appearance:none;padding-left:30px}
.select:after{content:'';position:absolute;left:14px;top:50%;width:8px;height:8px;border-left:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:translateY(-70%) rotate(-45deg);pointer-events:none}

/* ---------------- Toggle ---------------- */
.tgl{width:48px;height:27px;border-radius:99px;background:#d3dae6;position:relative;transition:.25s;flex:none}
.tgl:after{content:'';position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:99px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:.25s var(--ease)}
.tgl.on{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 12px -3px rgba(5,150,105,.5)}
.tgl.on:after{right:24px}

/* ---------------- Misc ---------------- */
.hr{height:1px;background:var(--line2);margin:16px 0;border:none}
.tag{font-size:11px;font-weight:700;background:#f0f2f8;color:var(--ink2);padding:4px 10px;border-radius:8px;border:1px solid var(--line)}
.progress{height:8px;border-radius:99px;background:#edf0f7;overflow:hidden;box-shadow:inset 0 1px 2px rgba(10,15,30,.06)}
.progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .6s var(--ease);position:relative}
.progress i:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);background-size:200% 100%;animation:shimmer 2.4s infinite}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;font-size:13px}
.kv b{font-weight:700;font-variant-numeric:tabular-nums}
.kv span{color:var(--mut);font-weight:500}
.note{background:linear-gradient(135deg,var(--brandSoft),#eefbf9);border:1px solid #bfe9e1;border-radius:14px;padding:13px 16px;font-size:12.5px;color:var(--brandInk);display:flex;gap:10px;align-items:flex-start;line-height:1.7}
.note svg{width:16px;height:16px;flex:none;margin-top:3px}
.note.warn{background:linear-gradient(135deg,var(--amberSoft),#fefaf2);border-color:#f3d9a6;color:#92400e}
.steps{display:flex;gap:0;margin:8px 0 2px}
.step{flex:1;text-align:center;position:relative;font-size:10.5px;font-weight:700;color:var(--mut2)}
.step .b{width:28px;height:28px;border-radius:99px;background:#eef1f7;color:var(--mut2);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-size:11px;position:relative;z-index:1;transition:.3s}
.step.done .b{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 4px 10px -3px rgba(5,150,105,.5)}
.step.cur .b{background:var(--grad-brand);color:#fff;box-shadow:0 0 0 5px rgba(13,148,136,.15);animation:pulseSoft 2s infinite}
.step:before{content:'';position:absolute;top:14px;right:50%;width:100%;height:2.5px;background:#eef1f7;border-radius:2px}
.step.done:before,.step.cur:before{background:linear-gradient(90deg,#10b981,#0d9488)}
.step:first-child:before{display:none}
.list-row{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--line2);transition:.15s}
.list-row:last-child{border-bottom:none}
.list-row:hover{padding-right:4px}
.ico{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:var(--sh-xs)}
.ico svg{width:17px;height:17px}
.bar{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:8px}
.bar i{flex:1;border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,var(--brand2),var(--brandDeep));min-height:5px;transition:height .5s var(--ease);position:relative;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.bar i:hover{filter:brightness(1.08)}
.bar i:hover:after{content:attr(data-v);position:absolute;top:-24px;right:50%;transform:translateX(50%);background:var(--navy);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:7px;white-space:nowrap;z-index:2}
.spark{width:100%;height:46px}
.pill-tabs{display:inline-flex;background:#eef1f8;border-radius:12px;padding:4px;gap:3px}
.pill-tabs button{padding:7px 15px;border-radius:9px;font-size:12px;font-weight:700;color:var(--mut);transition:.15s}
.pill-tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(10,15,30,.1)}

/* ---------------- Map ---------------- */
.mapbox{position:relative;border-radius:var(--r);overflow:hidden;background:linear-gradient(160deg,#e9eef6,#e2e9f3);min-height:300px;border:1px solid var(--line)}
.map-road{position:absolute;background:#fff;border:1px solid #dbe2ee;box-shadow:0 1px 0 rgba(255,255,255,.8)}
.map-park{position:absolute;background:linear-gradient(135deg,#d7edda,#cfe8d4);border-radius:14px;border:1px solid #c4e0c9}
.map-water{position:absolute;background:linear-gradient(160deg,#c9e2f7,#bcd9f2);border-radius:0 0 0 44px}
.mk{position:absolute;width:28px;height:28px;border-radius:99px 99px 99px 2px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;border:2.5px solid #fff;box-shadow:0 4px 10px rgba(10,15,30,.35);z-index:2;transition:all .8s var(--ease)}
.mk svg{transform:rotate(-45deg);width:13px;height:13px}
.mk.free{background:#64748b}.mk.busy{background:#f59e0b}.mk.off{background:#cbd5e1}
.mk.co{background:#7c3aed}.mk.dest{background:var(--red);animation:pulse 1.6s infinite}
.mk.me{background:var(--brand);animation:pulseSoft 1.8s infinite}
.mk-route{position:absolute;z-index:1}
.map-legend{position:absolute;bottom:14px;right:14px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:13px;padding:10px 15px;display:flex;gap:15px;font-size:11px;font-weight:700;z-index:3;box-shadow:var(--sh)}
.map-legend span{display:flex;align-items:center;gap:6px}
.map-badge{position:absolute;top:14px;right:14px;z-index:3;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:99px;padding:7px 14px;font-size:11.5px;font-weight:800;display:flex;align-items:center;gap:7px;box-shadow:var(--sh)}

/* ---------------- Phone (courier) ---------------- */
.phone-wrap{display:flex;justify-content:center;padding:14px 0 40px;position:relative}
.phone{width:392px;background:linear-gradient(160deg,#151d38,#0a1024);border-radius:52px;padding:11px;box-shadow:var(--sh-lg),0 0 0 2px rgba(255,255,255,.06),inset 0 1px 0 rgba(255,255,255,.1)}
.phone .scr{background:linear-gradient(180deg,#f6f8fc,#eef2f9);border-radius:42px;overflow:hidden;height:780px;display:flex;flex-direction:column;position:relative}
.phone .notch{height:30px;display:flex;align-items:center;justify-content:center;background:transparent;position:absolute;top:0;left:0;right:0;z-index:5}
.phone .notch i{width:112px;height:24px;background:#0a1024;border-radius:99px}
.app-head{background:linear-gradient(150deg,#0f766e 0%,#115e59 60%,#134e4a 100%);color:#fff;padding:44px 20px 22px;position:relative;overflow:hidden}
.app-head:before{content:'';position:absolute;top:-40px;left:-30px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.25),transparent 70%)}
.app-body{flex:1;overflow-y:auto;padding:16px}
.app-tabbar{display:flex;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 8px 20px}
.app-tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;color:var(--mut2);transition:.18s;border-radius:12px;padding:4px 0}
.app-tabbar button svg{width:21px;height:21px}
.app-tabbar button.on{color:var(--brandDeep)}
.app-tabbar button.on:before{content:'';position:absolute;top:-10px;width:36px;height:3px;border-radius:3px;background:var(--grad-brand);position:relative;display:block}
.bigcard{background:#fff;border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--sh);margin-bottom:13px;animation:fadeUp .3s var(--ease)}
.bigbtn{width:100%;padding:16px;border-radius:15px;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;transition:all .18s var(--ease)}
.bigbtn:active{transform:scale(.98)}
.bigbtn svg{width:19px;height:19px}
.bigbtn.accept{background:linear-gradient(135deg,#10b981,#059669);color:#fff;box-shadow:0 10px 24px -8px rgba(5,150,105,.55)}
.bigbtn.decline{background:#fff;border:1.5px solid var(--line);color:var(--red)}
.bigbtn.step{background:var(--grad-navy);color:#fff;box-shadow:0 10px 24px -8px rgba(10,15,30,.5)}
.timer{display:flex;align-items:center;justify-content:center;gap:8px;font-variant-numeric:tabular-nums}

/* ---------------- Drawer ---------------- */
.ovl{position:fixed;inset:0;background:rgba(10,15,36,.5);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;animation:pop .2s}
.modal{background:#fff;border-radius:24px;width:600px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:up .25s var(--ease)}
@keyframes up{from{transform:translateY(18px);opacity:0}}
.modal .mh{display:flex;align-items:center;gap:10px;padding:20px 24px;border-bottom:1px solid var(--line2)}
.modal .mh h3{font-size:16.5px;font-weight:800}
.modal .mb{padding:22px 24px}
.modal .mf{padding:15px 24px;border-top:1px solid var(--line2);display:flex;gap:10px;background:#fafbfe;border-radius:0 0 24px 24px}

/* ---------------- Toast ---------------- */
.toast{position:fixed;bottom:26px;right:50%;transform:translateX(50%);background:var(--grad-navy);color:#fff;padding:13px 22px;border-radius:14px;font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center;z-index:60;box-shadow:var(--sh-lg);animation:up .3s var(--ease);border:1px solid rgba(255,255,255,.1)}
.toast svg{width:17px;height:17px;color:#5eead4}

/* ---------------- Launcher ---------------- */
.launch{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;padding:44px 24px;position:relative;overflow:hidden}
.launch .hero{text-align:center;max-width:660px;animation:fadeUp .5s var(--ease)}
.launch .hero .logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,#2dd4bf,#0d9488 55%,#0b5c54);display:flex;align-items:center;justify-content:center;color:#fff;font-size:34px;font-weight:800;margin:0 auto 20px;box-shadow:0 20px 44px -10px rgba(13,148,136,.55),inset 0 2px 0 rgba(255,255,255,.3);animation:floaty 4s ease-in-out infinite}
.launch h1{font-size:34px;font-weight:800;letter-spacing:-.7px;background:linear-gradient(120deg,#0a0f1e 30%,#0f766e);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.launch .hero p{color:var(--mut);font-size:14.5px;margin-top:8px;line-height:1.9}
.launch .hero p b{color:var(--brandInk)}
.launch .stats{display:flex;gap:38px;margin-top:14px}
.launch .stats div{text-align:center}
.launch .stats b{font-size:22px;font-weight:800;color:var(--brandInk);font-variant-numeric:tabular-nums}
.launch .stats span{display:block;font-size:11.5px;color:var(--mut);font-weight:600}
.pcards{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;max-width:1080px;width:100%;animation:fadeUp .6s var(--ease) .1s backwards}
.pcard{background:rgba(255,255,255,.86);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:22px;padding:26px;text-align:right;transition:all .25s var(--ease);box-shadow:var(--sh);position:relative;overflow:hidden}
.pcard:before{content:'';position:absolute;top:0;right:0;left:0;height:3px;background:var(--grad-brand);opacity:0;transition:.25s}
.pcard:hover{transform:translateY(-6px);box-shadow:var(--sh-lg);border-color:#bfe9e1}
.pcard:hover:before{opacity:1}
.pcard .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:0 10px 22px -10px rgba(10,15,30,.3),inset 0 1px 0 rgba(255,255,255,.4)}
.pcard .ic svg{width:24px;height:24px}
.pcard b{font-size:16px;font-weight:800;display:block}
.pcard p{font-size:12.5px;color:var(--mut);margin-top:5px;line-height:1.8;min-height:54px}
.pcard .go{margin-top:14px;font-size:12.5px;font-weight:800;color:var(--brandInk);display:inline-flex;align-items:center;gap:6px;transition:gap .2s}
.pcard:hover .go{gap:10px}
.launch .ver{font-size:11.5px;color:var(--mut2);font-weight:600}
@media(max-width:920px){.pcards{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.pcards{grid-template-columns:1fr}.pcard p{min-height:0}}

/* ---------------- Tablet: slim icon rail ---------------- */
@media(max-width:1120px){
  .shell{grid-template-columns:78px 1fr}
  .side{padding:16px 10px;align-items:stretch}
  .brand{padding:2px 0 14px;justify-content:center}
  .brand b,.brand small,.side .foot{display:none}
  .navlab{font-size:9px;padding:12px 0 4px;text-align:center;letter-spacing:.6px}
  .nav{justify-content:center;gap:0;padding:12px 0;width:100%;border-radius:13px}
  .nav>span:not(.pip){display:none}
  .nav .pip{position:absolute;top:5px;left:5px;margin:0;font-size:9px;padding:1px 5px}
  .g4,.g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g21,.g12{grid-template-columns:minmax(0,1fr)}
  .main{padding:20px 18px 44px}
  .card .bd{overflow-x:auto}
  .tbl{min-width:560px}
  .stat .v{font-size:22px}
}
@media(max-width:1120px) and (min-width:761px){
  .launch h1{font-size:27px}
  .launch .stats{gap:22px;flex-wrap:wrap;justify-content:center}
}

/* ---------------- Phone: top scroll nav ---------------- */
@media(max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;min-height:0;flex-direction:row;align-items:center;gap:4px;padding:10px 12px;overflow-x:auto;overflow-y:hidden;z-index:30;box-shadow:0 6px 20px -8px rgba(10,15,30,.35)}
  .brand{padding:0 4px 0 8px;flex:none}
  .brand .logo{width:34px;height:34px;border-radius:11px;font-size:15px}
  .brand b,.brand small,.navlab,.side .foot{display:none}
  .nav{width:auto;flex:none;padding:9px 13px;border-radius:11px;white-space:nowrap;font-size:12.5px}
  .nav.on:before{right:8px;left:8px;top:auto;bottom:-10px;width:auto;height:3px}
  .nav .pip{position:static;margin-inline-start:6px}
  .nav:hover{transform:none}
  .main{padding:18px 14px 40px}
  .topbar{flex-wrap:wrap}
  .topbar h1{font-size:19px}
  .g4,.g3,.g2,.g21,.g12{grid-template-columns:minmax(0,1fr)}
  .tbl{min-width:520px}
  .phone .scr{height:640px}
}
</style>
